name: Build FixIt Assistant APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblldb-dev libffi-dev libffi7 platform-tools ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixin-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev
        pip install --upgrade pip buildozer cython

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Find and Copy APK
      run: |
        mkdir -p output_apk
        find . -name "*.apk" -exec cp {} output_apk/ \;
        ls -la output_apk/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: fix-it-assistant-apk
        path: "output_apk/*.apk"
