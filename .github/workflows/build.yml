name: Build FixIt Assistant APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. GitHub Repository से कोड लेगा
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Python 3.10 सेट करेगा
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Android build के लिए जरूरी सिस्टम टूल्स इंस्टॉल करेगा
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3-pip ccache libffi-dev \
        libssl-dev zip unzip openjdk-17-jdk autoconf libtool pkg-config cmake \
        libsqlite3-dev libbz2-dev libreadline-dev libncurses5-dev

    # 4. Buildozer और Cython इंस्टॉल करेगा
    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.33

    # 5. Buildozer चलाकर APK बनाएगा
    - name: Build APK with Buildozer
      run: |
        yes | buildozer -v android debug

    # 6. तैयार APK को Download करने के लिए Artifacts में अपलोड करेगा
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FixIt-Assistant-APK
        path: bin/*.apk
