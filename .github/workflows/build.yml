name: Build FixIt Assistant APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git ffmpeg libsdl2-dev libsdl2-image-dev \
          libsdl2-mixin-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
          libavformat-dev libavcodec-dev zlib1g-dev libgdbm-dev \
          libncurses5-dev libssl-dev libffi-dev libsqlite3-dev \
          readline-common libbz2-dev ccache openjdk-17-jdk

    - name: Install Fixed Build Tools
      run: |
        python -m pip install --upgrade setuptools wheel
        python -m pip install "pip==23.0.1"
        python -m pip install "cython==0.29.33" "buildozer==1.5.0"
        python -m pip install "git+https://github.com/kivy/python-for-android.git"

    - name: Clear Build Cache
      run: |
        rm -rf .buildozer ~/.buildozer || true
        rm -rf .buildozer/android/platform/build-* || true

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FixIt-Assistant-APK
        path: bin/*.apk
